# The lab's resources (its package). The lab loads them at run time
# (src/lab/resources.rs), processed by the resource pipeline (src/lab/pipeline)
# and cached in build/resources. Paths are relative to this file;
# THIRD_PARTY.md records each source's terms.

include = ["files.toml", "shaders.toml"]

# The sky and its lighting (src/lab/environment.rs): the sun's disc is capped
# at 5 in the photograph's units (the glare one to two degrees from it), which
# removes about two thirds of the image's light, all within three degrees of
# the sun. Level 0 is the image, 4096 x 2048; the backdrop reads it, and
# lighting reads level 2.
[[resource]]
id = "environment"
kind = "radiance"
source = "../../assets/environments/tree_lined_driveway_4k.hdr"
license = "CC0-1.0"
sun-cap = 5.0
levels = 3

# The Utah teapot (src/lab/mesh.rs). The OBJ is 3.15 units tall, base at y = 0;
# the scale makes it 0.44 m tall. intersectMesh's traversal stack holds 30
# levels (mesh::MAX_DEPTH).
[[resource]]
id = "teapot"
kind = "mesh"
source = "../../assets/models/utah_teapot.obj"
license = "Utah Teapot terms (THIRD_PARTY.md)"
scale = 0.14
leaf-triangles = 4
max-depth = 30

# The lab's scenes (src/lab/scene.rs), by key: `scene/<key>`.
[[resource]]
id = "scene/study-room"
kind = "file"
source = "scenes/study-room.toml"
license = "MIT"

[[resource]]
id = "scene/terrain"
kind = "file"
source = "scenes/terrain.toml"
license = "MIT"
