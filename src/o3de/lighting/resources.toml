# The O3DE lighting investigation's package (`Investigation::package`): its
# scene shading, a WGSL port of O3DE's shader code, composed after the lab's
# scene module (`SceneShading::module`). Paths are relative to this file.

[[resource]]
id = "o3de/lighting/wgsl/standard-lighting"
kind = "file"
source = "shaders/standard_lighting.wgsl"
license = "MIT (O3DE, THIRD_PARTY.md)"

[[shader]]
id = "o3de/lighting/shader/standard-lighting"
parts = ["shader/scene", "o3de/lighting/wgsl/standard-lighting"]

