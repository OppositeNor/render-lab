# Render Lab: the binary (src/main.rs), the lab it runs (lab/), and the
# public packages' libraries (packages/<name>, each a cdylib the lab loads at
# run time; src/packages.rs in the lab). A package's library depends on the lab
# alone, and on crates the lab depends on, with no more features than the
# lab's, so every crate sees one build of the lab. lab/abi-test holds two test
# libraries of the C ABI between packages, built the same way, for the lab's tests.
[workspace]
members = ["lab", "lab/abi-test/exporter", "lab/abi-test/importer", "lab/check", "lab/derive", "packages/o3de_lighting", "packages/godot_sdfgi", "packages/godot_ssr", "packages/godot_voxelgi", "packages/godot_voxelgi/interface", "packages/paper_restir"]
default-members = [".", "lab/abi-test/exporter", "lab/abi-test/importer", "packages/o3de_lighting", "packages/godot_sdfgi", "packages/godot_ssr", "packages/godot_voxelgi", "packages/paper_restir"]
resolver = "3"

# The CPU mirrors keep the shape of the engine and shader code they port: its
# index loops. A function holds at most 100 lines (clippy.toml), a Rust or
# Python file at most 1400 (tools/check_sizes.py).
[workspace.lints.clippy]
needless_range_loop = "allow"
too_many_lines = "deny"

[package]
name = "render-lab"
version = "0.0.6"
edition = "2024"
rust-version = "1.100"
publish = false
description = "Rendering demonstration and experiment lab: interactive viewer and deterministic recorder"
license = "MIT"

# It only runs the lab; a test harness of it could not link the lab's dylib (the lab's tests are the lab's).
[[bin]]
name = "render-lab"
path = "src/main.rs"
test = false

[lints]
workspace = true

[dependencies]
lab = { package = "render-lab-core", path = "lab" }

[profile.release]
debug = "line-tables-only"
