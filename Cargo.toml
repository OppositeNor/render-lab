[package]
name = "render-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Rendering demonstration and experiment lab: interactive viewer and deterministic recorder"
license = "MIT"

[dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
winit = "=0.30.13"
egui = "=0.37.0"
egui-wgpu = { version = "=0.37.0", default-features = false }
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.34", features = ["bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = "0.4"
anyhow = "1"
png = "0.18"
clap = { version = "4.6", features = ["derive"] }
sha2 = "0.10"
# The user's settings file (parsing only; the lab writes the file itself). Already vendored.
toml_edit = { version = "=0.25.17", default-features = false, features = ["parse"] }
# Formulas: LaTeX translated to Typst math by MiTeX, typeset by Typst with its bundled fonts
# (New Computer Modern Math), and rasterized into coverage masks (src/lab/formula.rs).
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-render = "=0.15.1"
typst-assets = { version = "=0.15.1", features = ["fonts"] }
mitex = "=0.2.4"

[build-dependencies]
# The same naga release wgpu 30.0.1 uses, for build-time WGSL validation and layouts.
naga = { version = "=30.0.1", features = ["wgsl-in"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
debug = "line-tables-only"
