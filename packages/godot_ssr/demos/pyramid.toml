# The depth pyramid, a level at a time, the pixel's cell in it.

key = "pyramid"
title-text = "shot.pyramid_title"
tab-text = "shot.pyramid"
hint-text = "hints.pyramid_demo"
scene = "render_lab.scene/study-room"
listing = "pyramid"
resets-camera = true
# Its Play animation (script/animations.lam).
animation = "playPyramid"
include = ["room-camera"]

[params]
floorRoughness = 0.15
skyReflection = 0.0
floorMetallic = 1.0
