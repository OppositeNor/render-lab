# The narrated video's timelines and narration, built by tools/video from
# video/ into build/ (`built`: missing until they are built).
# Both editions play the English narration.
[[resource]]
id = "timeline/en"
kind = "file"
source = "build/timelines/en/timeline.json"
license = "MIT"
built = true

[[resource]]
id = "timeline/zh-cn"
kind = "file"
source = "build/timelines/zh-CN/timeline.json"
license = "MIT"
built = true

[[resource]]
id = "narration/en"
kind = "file"
source = "build/video/en/narration.wav"
license = "MIT"
built = true

# The scene shading: the lab's scene module, then the opaque pass and pre-pass, then the SSR passes.
[[shader]]
id = "shader/ssr-shading"
parts = ["render_lab.shader/scene", "wgsl/ssr-shading", "wgsl/ssr-passes"]

