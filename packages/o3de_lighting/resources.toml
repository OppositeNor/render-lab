# The O3DE lighting investigation's resources (a collection of the
# o3de_lighting package, manifest.toml): its scene shading, a WGSL port of
# O3DE's shader code, composed after the lab's scene module
# (`SceneShading::module`). Paths are relative to this file.

[[resource]]
id = "wgsl/standard-lighting"
kind = "file"
source = "shaders/standard_lighting.wgsl"
license = "MIT (O3DE, THIRD_PARTY.md)"

# The VIEW_* constants of brdf::ViewMode, which the lab writes into build/
# whenever it loads the investigation (lab/src/shader_data.rs).
[[resource]]
id = "wgsl/view-mode"
kind = "file"
source = "build/generated/view_mode.wgsl"
license = "MIT"
built = true

[[shader]]
id = "shader/standard-lighting"
parts = ["render_lab.shader/scene", "wgsl/view-mode", "wgsl/standard-lighting"]

