requires = ["rlstd.knowledge#rt-reflection-probes", "rlstd.knowledge#rt-ssr", "rlstd.knowledge#rt-stencil", "rlstd.knowledge#gi-probes", "rlstd.knowledge#cg-ao"]

[[chapter]]
