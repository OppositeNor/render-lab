# The chapters of this investigation's story and what each uses directly, from the
# knowledge graph (rlstd's knowledge.toml), and the audience it is aimed at (lab/src/knowledge.rs;
# the `knowledge-graph` agent skill chose it). Recap chapters list nothing.

[audience]
profile = "Has written a PBR forward renderer with shadow maps and compute passes: knows the GPU pipeline, depth, sampling, G-buffers, microfacet BRDFs, punctual lights, shadow maps, and what global illumination is."
known = ["rlstd.knowledge#gpu-formats", "rlstd.knowledge#gpu-compute", "rlstd.knowledge#gpu-passes", "rlstd.knowledge#rt-spaces", "rlstd.knowledge#rt-depth", "rlstd.knowledge#rt-sampling", "rlstd.knowledge#rt-cubemaps", "rlstd.knowledge#rt-blend", "rlstd.knowledge#rt-color", "rlstd.knowledge#rt-normal-maps", "rlstd.knowledge#rt-gbuffer", "rlstd.knowledge#geo-bounds", "rlstd.knowledge#geo-grids", "rlstd.knowledge#cg-visibility", "rlstd.knowledge#cg-lights", "rlstd.knowledge#cg-brdf", "rlstd.knowledge#cg-fresnel", "rlstd.knowledge#cg-microfacet", "rlstd.knowledge#cg-ggx", "rlstd.knowledge#cg-pbr-materials", "rlstd.knowledge#cg-mc", "rlstd.knowledge#rt-shadow-maps"]

[[chapter]]
number = 1
demos = ["room"]
requires = ["rlstd.knowledge#rt-gbuffer", "rlstd.knowledge#rt-msaa", "rlstd.knowledge#rt-stencil", "rlstd.knowledge#gpu-frame", "rlstd.knowledge#gpu-hdr-formats", "rlstd.knowledge#rt-octahedral"]

[[chapter]]
