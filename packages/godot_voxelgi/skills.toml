# The chapters of this investigation's story and what each uses directly, from the
# skill graph (rlstd's skills.toml), and the audience it is aimed at (lab/src/skills.rs;
# the `skill-graph` agent skill chose it). Recap chapters list nothing.

[audience]
profile = "Has written a PBR forward renderer with shadow maps and compute passes: knows the GPU pipeline, depth, sampling, G-buffers, microfacet BRDFs, punctual lights, shadow maps, and what global illumination is."
known = ["rlstd.skills#gpu-formats", "rlstd.skills#gpu-compute", "rlstd.skills#gpu-passes", "rlstd.skills#rt-spaces", "rlstd.skills#rt-depth", "rlstd.skills#rt-sampling", "rlstd.skills#rt-cubemaps", "rlstd.skills#rt-blend", "rlstd.skills#rt-color", "rlstd.skills#rt-normal-maps", "rlstd.skills#geo-bounds", "rlstd.skills#geo-grids", "rlstd.skills#cg-visibility", "rlstd.skills#cg-lights", "rlstd.skills#cg-brdf", "rlstd.skills#cg-fresnel", "rlstd.skills#cg-microfacet", "rlstd.skills#cg-ggx", "rlstd.skills#cg-pbr-materials", "rlstd.skills#cg-mc", "rlstd.skills#cg-gi"]

[[chapter]]
number = 1
demos = ["room", "bounds"]
requires = ["rlstd.skills#cg-gi", "rlstd.skills#gpu-frame", "rlstd.skills#rt-depth"]

[[chapter]]
