# The chapters of this investigation's story and what each uses directly, from the
# knowledge graph (render_lab's knowledge.toml), and the audience it is aimed at (lab/src/knowledge.rs;
# the `knowledge-graph` agent skill chose it). Recap chapters list nothing.

[audience]
profile = "Has written a PBR forward renderer with shadow maps and compute passes: knows the GPU pipeline, depth, sampling, G-buffers, microfacet BRDFs, punctual lights, shadow maps, and what global illumination is."
known = ["render_lab.knowledge#gpu-formats", "render_lab.knowledge#gpu-compute", "render_lab.knowledge#gpu-sync", "render_lab.knowledge#gpu-passes", "render_lab.knowledge#rt-spaces", "render_lab.knowledge#rt-depth", "render_lab.knowledge#rt-sampling", "render_lab.knowledge#rt-cubemaps", "render_lab.knowledge#rt-blend", "render_lab.knowledge#rt-color", "render_lab.knowledge#geo-bounds", "render_lab.knowledge#geo-grids", "render_lab.knowledge#cg-visibility", "render_lab.knowledge#cg-lights", "render_lab.knowledge#cg-brdf", "render_lab.knowledge#cg-fresnel", "render_lab.knowledge#cg-microfacet", "render_lab.knowledge#cg-ggx", "render_lab.knowledge#cg-pbr-materials", "render_lab.knowledge#cg-mc", "render_lab.knowledge#cg-gi"]

[[chapter]]
number = 1
demos = ["room", "bounds"]
requires = ["render_lab.knowledge#cg-gi", "render_lab.knowledge#gpu-frame", "render_lab.knowledge#rt-depth"]

