id = "wgsl/voxelgi-passes"
kind = "file"
source = "shaders/voxelgi_passes.wgsl"
license = "MIT (Godot, THIRD_PARTY.md)"

[[shader]]
id = "shader/voxelgi-shading"
parts = ["rlstd.shader/scene", "wgsl/voxelgi-shading", "wgsl/voxelgi-passes"]

