# The Godot VoxelGI investigation's package (its code is src/godot/voxelgi,
# which names it with `Investigation::package`): its text, source index,
# pseudo-code listings, demonstrations, and narrated video.

name = "godot_voxelgi"
author = "OppositeNor"
license = "MIT"
import = ["render_lab"]
# Its code (src/, Cargo.toml): the library the lab opens, and its negotiation
# function, which hands the lab the package's investigations (lab/src/plugin.rs).
library = "godot_voxelgi"
negotiate = "godot_voxelgi_negotiate"
export = []

# The copyright and license line shown after the engine's version (src/packages.rs).
credit-text = "notice-credit"
# The homepage folder its investigation is in (lab/src/packages/fields.rs).
field = "render_lab.computer-graphics"
# Where its narration package (godot_voxelgi_narration) is published: the homepage offers to download it when it is missing.
narration-url = "https://github.com/OppositeNor/render-lab/releases/download/v{version}/godot_voxelgi_narration-v{version}.zip"

[[provides]]
type = "resource"
path = "resources.toml"

# Legal notices (src/packages.rs `[[notice]]`): shown on the homepage, at the end of its videos, and beside them.

[[notice]]
notice-text = "notice-copyright"
license = "LICENSE-Godot.txt"

[[notice]]
notice-text = "notice-trademark"
