# The narrated videos of the package `godot_sdfgi`: their timelines and narration, which tools/video builds from
# packages/godot_sdfgi/video/ into build/ here. Each demo narrates `godot_sdfgi`'s investigations (`for`). A release
# publishes this package on its own (tools/publish_narration.py), the same on every platform.

name = "godot_sdfgi_narration"
author = "OppositeNor"
license = "MIT"
import = ["godot_sdfgi"]
export = []

[[provides]]
type = "resource"
path = "resources.toml"

[[provides]]
type = "demo"
key = "video"
title = "How Godot's SDFGI Lights a Room"
timeline = "timeline/en"
audio = "narration/en"
for = "godot_sdfgi"

[[provides]]
type = "demo"
key = "video-zh-CN"
title = "Godot 的 SDFGI 如何照亮一个房间"
timeline = "timeline/zh-cn"
audio = "narration/zh-cn"
for = "godot_sdfgi"
