# Weighted reservoir sampling at one pixel, P: candidates streamed one at a time through a reservoir, then a second
# stream merged in; its math scene (script/wrs.lam) shows the stream in place of the room, on the math scenes'
# example world (examples.rs), so every candidate weighs something.

key = "wrs"
title-text = "shot-wrs_title"
tab-text = "shot-wrs"
hint-text = "shot-wrs_hint"
scene = "paper_restir.scene/restir-room"
resets-camera = true
math = "wrsMath"
clips = ["wrsSteps"]

[camera]
target = [0.1, 0.8, -0.5]
yaw = 24.0
pitch = 18.0
distance = 3.6
fov = 55.0

[params]
restirStage = 0
restirTemporal = 0
restirSpatialPasses = 0
restirCandidates = 16
risStep = 16
