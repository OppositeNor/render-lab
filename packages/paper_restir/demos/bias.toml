# Bias in RIS: the paper's 1D example (Fig. 7), redrawn from the lab's runs of it (demos/bias.rs); its math scene
# (script/bias.lam) shows it in place of the room.

key = "bias"
title-text = "shot-bias_title"
tab-text = "shot-bias"
hint-text = "shot-bias_hint"
scene = "paper_restir.scene/restir-room"
resets-camera = true
math = "biasMath"
clips = ["biasSteps"]

[camera]
target = [0.0, 0.9, -0.6]
yaw = 18.0
pitch = 14.0
distance = 4.6
fov = 55.0


[params]
