# A reference: the frames averaged while nothing moves, with streaming RIS and no reuse, so it converges without bias.

key = "reference"
title-text = "shot-reference_title"
tab-text = "shot-reference"
hint-text = "shot-reference_hint"
scene = "paper_restir.scene/restir-room"
listing = "frame"
resets-camera = true

[camera]
target = [0.0, 0.9, -0.6]
yaw = 18.0
pitch = 14.0
distance = 4.6
fov = 55.0

[params]
restirAccumulate = 1
restirTemporal = 0
restirSpatialPasses = 0
