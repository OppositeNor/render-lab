# ReSTIR in the room: its many lights, every pixel lit through the paper's passes.

key = "accum"
title-text = "shot-room_title"
tab-text = "shot-room"
hint-text = "investigation-demo_hint"
scene = "paper_restir.scene/restir-room"
listing = "frame"
resets-camera = true

[camera]
target = [0.0, 0.9, -0.6]
yaw = 18.0
pitch = 14.0
distance = 4.6
fov = 55.0

[params]
restirAccumulate = 1
restirTemporal = 0
restirSpatialPasses = 0
