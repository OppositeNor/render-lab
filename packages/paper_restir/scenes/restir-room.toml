# ReSTIR's room (src/paper/restir/lights.rs places its lights): the study room of the render_lab package (its
# scenes/study-room.lam, the TOML it is read as), its ceiling panel dark, and 64 small spherical lights, each placed,
# sized, and coloured every frame by the investigation (`lights::place`), so they move as the paper's dynamic
# lights do. The format is the study room's.

camera-clear = { room-margin = 0.2 }
title-text = "scene-restir_room"

[lighting]
ambient = 0.12
exposure = 1.0
f0 = 0.04
ggx-samples = 16
light = "emissive panel"
reflection-strength = 1.0

