# The ReSTIR investigation's package (its code is src/paper/restir, which names it with `Investigation::package`):
# a demonstration of Bitterli et al. 2020's method, read from the paper. Its text, citation index, pseudo-code
# listings, demonstrations, scene, and narrated video.

name = "paper_restir"
author = "OppositeNor"
license = "MIT"
import = ["render_lab"]
# Its code (src/, Cargo.toml): the library the lab opens, and its negotiation
# function, which hands the lab the package's investigations (lab/src/plugin.rs).
library = "paper_restir"
negotiate = "paper_restir_negotiate"
export = []

# The line shown after the paper's name and venue (src/packages.rs).
credit-text = "notice-credit"

[[provides]]
type = "resource"
path = "resources.toml"
