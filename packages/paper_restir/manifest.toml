# The ReSTIR investigation's package (its code is src/paper/restir, which names it with `Investigation::package`):
# a demonstration of Bitterli et al. 2020's method, read from the paper. Its text, citation index, pseudo-code
# listings, demonstrations, scene, and narrated video.

name = "paper_restir"
author = "OppositeNor"
license = "MIT"
import = ["render_lab"]
# Its code (src/, Cargo.toml): the library the lab opens, and its negotiation
# function, which hands the lab the package's investigations (lab/src/plugin.rs).
library = "paper_restir"
negotiate = "paper_restir_negotiate"
export = []
# Its shadow rays trace the scene in hardware (lab/src/gpu.rs, src/ray_tracing.rs).
requires = ["ray-tracing"]

# The line shown after the paper's name and venue (src/packages.rs).
credit-text = "notice-credit"
# The homepage folder its investigation is in (lab/src/packages/fields.rs).
field = "render_lab.computer-graphics"
# Where its narration package (paper_restir_narration) is published: the homepage offers to download it when it is missing.
narration-url = "https://github.com/OppositeNor/render-lab/releases/download/v{version}/paper_restir_narration-v{version}.zip"

[[provides]]
type = "resource"
path = "resources.toml"

