# The chapters of this investigation's story and what each uses directly, from the
# skill graph (rlstd's skills.toml), and the audience it is aimed at (lab/src/skills.rs;
# the `skill-graph` agent skill chose it). Recap chapters list nothing.

[audience]
profile = "Has written a PBR forward renderer with shadow maps and compute passes: knows the GPU pipeline, depth, sampling, G-buffers, microfacet BRDFs, punctual lights, shadow maps, and what global illumination is."
