# The lab's own package: what every investigation shares (lab/). The lab
# finds every package in packages/ (lab/src/packages.rs); this one is imported by
# the others, which name what it exports as `render_lab.<key>`.
# Its code (src/) is not a library of its own: the lab builds it in as
# `lab::utility` (lab/src/lib.rs), the pieces investigations share.

name = "render_lab"
author = "OppositeNor"
license = "MIT"
import = []
# The scenes demonstrations show, the shader modules investigations build on, and the
# knowledge graph investigations name the nodes of (`render_lab.knowledge#<key>`, lab/src/knowledge.rs).
export = ["scene/study-room", "scene/study-room-grounds", "scene/terrain", "shader/prelude", "shader/scene", "shader/rays", "knowledge", "demo-preset/room-camera"]

# The sky, the teapot, the scenes, and the homepage's sounds and icon.
[[provides]]
type = "resource"
path = "resources.toml"

# Fonts, MiTeX's Typst scope, and the lab's on-screen text.
[[provides]]
type = "resource"
path = "files.toml"

# The lab's WGSL and its shader modules.
[[provides]]
type = "resource"
path = "shaders.toml"
