# The lab's fonts (lab/src/text.rs), MiTeX's Typst scope for formulas
# (lab/src/formula.rs), and its on-screen text (lab/src/i18n.rs), read as they
# are. A collection of the render_lab package (manifest.toml).

[[resource]]
id = "font/dejavu-sans"
kind = "file"
source = "assets/fonts/DejaVuSans.ttf"
license = "DejaVu fonts license"

[[resource]]
id = "font/dejavu-sans-bold"
kind = "file"
source = "assets/fonts/DejaVuSans-Bold.ttf"
license = "DejaVu fonts license"

[[resource]]
id = "font/dejavu-sans-mono"
kind = "file"
source = "assets/fonts/DejaVuSansMono.ttf"
license = "DejaVu fonts license"

[[resource]]
id = "font/dejavu-sans-mono-bold"
kind = "file"
source = "assets/fonts/DejaVuSansMono-Bold.ttf"
license = "DejaVu fonts license"

# Chinese text falls back to Source Han Sans in every family.
[[resource]]
id = "font/source-han-sans"
kind = "file"
source = "assets/fonts/SourceHanSansCN-Regular.otf"
license = "OFL-1.1"

[[resource]]
id = "font/source-han-sans-bold"
kind = "file"
source = "assets/fonts/SourceHanSansCN-Bold.otf"
license = "OFL-1.1"

[[resource]]
id = "mitex/mod"
kind = "file"
source = "assets/mitex/specs/mod.typ"
license = "Apache-2.0"

[[resource]]
id = "mitex/prelude"
kind = "file"
source = "assets/mitex/specs/prelude.typ"
license = "Apache-2.0"

[[resource]]
id = "mitex/latex/standard"
kind = "file"
source = "assets/mitex/specs/latex/standard.typ"
license = "Apache-2.0"

# The languages of the on-screen text (lab/src/i18n.rs `Locale`), read by the lab and by every package's build.
[[resource]]
id = "locales"
kind = "file"
source = "locales.toml"
license = "MIT"

[[resource]]
id = "text/en"
kind = "file"
source = "text/en.ftl"
license = "MIT"

[[resource]]
id = "text/zh-cn"
kind = "file"
source = "text/zh-CN.ftl"
license = "MIT"

# The knowledge graph: the three bases and the engine-neutral topics the
# investigations' chapters need (lab/src/knowledge.rs).
[[resource]]
id = "knowledge"
kind = "file"
source = "knowledge.toml"
license = "MIT"

# render_lab's Lamlet package (lab/src/script/): storyboards import it as `render_lab`.
[[resource]]
id = "script/render-lab"
kind = "file"
source = "language/render_lab.lam"
license = "MIT"

# render_lab's runtime library (lab/src/script/runtime.rs): every package's scripts import it as
# `render_lab_runtime`.
[[resource]]
id = "script/runtime"
kind = "file"
source = "language/runtime.lam"
license = "MIT"
