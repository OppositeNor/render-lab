# The narrated videos of the package `godot_ssr`: their timelines and narration, which tools/video builds from
# packages/godot_ssr/video/ into build/ here. Each demo narrates `godot_ssr`'s investigations (`for`). A release
# publishes this package on its own (tools/publish_narration.py), the same on every platform.

name = "godot_ssr_narration"
author = "OppositeNor"
license = "MIT"
import = ["godot_ssr"]
export = []

[[provides]]
type = "resource"
path = "resources.toml"

[[provides]]
type = "demo"
key = "video"
title = "How Godot's SSR Reflects a Room"
timeline = "timeline/en"
audio = "narration/en"
for = "godot_ssr"

[[provides]]
type = "demo"
key = "video-zh-CN"
title = "Godot 的 SSR 如何反射一个房间"
timeline = "timeline/zh-cn"
audio = "narration/zh-cn"
for = "godot_ssr"
