# VS Code: the colours of Visual Studio Code's Dark Modern theme, with the
# Dark+ colours for code. Every key is described in one-dark-pro.toml.
name = "VS Code"

[colors]
background = "#1f1f1f"
panel = "#181818"
panel_raised = "#313131"
border = "#2b2b2b"
text = "#cccccc"
text_dim = "#9d9d9d"
text_faint = "#6e7681"
accent = "#4daafc"
highlight_row = "#264f78d0"
padding = "#454545"
hover = "#2a2d2e"
selection = "#04395e"
field_even = "#4a4f55"
field_odd = "#37373d"
track = "#3c3c3c"
card = "#202020f0"
smoke = "#14141478"
popup = "#1f1f1feb"
dim = "#00000096"
shadow = "#000000"
code_keyword = "#569cd6"
code_name = "#dcdcaa"
code_number = "#b5cea8"
code_string = "#ce9178"
