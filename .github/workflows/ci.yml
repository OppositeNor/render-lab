# Render Lab's CI: on every push to main and every pull request, check the Rust formatting (rustfmt), build the
# public tree without warnings, run the unit tests, clippy, the content checks and the Python tests; on a `v*` tag,
# also package Linux, Windows, and macOS and publish them as one GitHub Release. The runners have no GPU, so the checks that draw a frame (offscreen
# snapshots, autotest, selftest) run on Mesa's software Vulkan (lavapipe) in a job of their own, and the
# frame identity check and the videos stay local (BUILD.md, AGENTS.md).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Build, test, check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Format
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --release --locked
      # The commands below need no GPU. They and the Python checks run before `cargo test`, whose build of
      # the lab's dylib can replace the one the binary links.
      - name: Content checks
        run: |
          lab=target/release/render-lab
          $lab cook
          $lab packages
          $lab i18n --check
          for ftl in packages/*/text/*.ftl; do $lab formulas --check "$ftl"; done
          for investigation in $($lab --list | awk '{print $1}'); do
            echo "::group::$investigation"
            $lab --investigation "$investigation" script check
            $lab --investigation "$investigation" knowledge
            $lab --investigation "$investigation" graph
            echo "::endgroup::"
          done
      # Some read the storyboards through the built lab.
      - name: Python checks
        run: |
          pip install numpy matplotlib
          python3 tools/check_skills.py
          python3 tools/check_sizes.py
          python3 tools/lamlet_fmt.py --check
          for test in tools/video/test_*.py tools/experiments/test_report.py tools/test_lamlet_fmt.py; do
            python3 -m unittest "$test"
          done
      - name: Clippy
        run: cargo clippy --release --locked --workspace
      - name: Unit tests
        run: cargo test --release --locked --workspace

  # macOS (Apple Silicon): not supported yet, so this job may fail. The lab builds wgpu with Metal there
  # (lab/Cargo.toml), but the runner has no GPU, so nothing that draws a frame runs. build.rs gives the binary
  # macOS's rpath (@executable_path). The release does not wait for it.
  macos:
    name: Build, test, check (macOS)
    runs-on: macos-15
    # RUSTFLAGS replaces .cargo/config.toml's macOS flags: `-C rpath` names the lab's dylib @rpath/liblab.dylib,
    # not its build path.
    env:
      RUSTFLAGS: -Dwarnings -Crpath
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Content checks
        run: |
          lab=target/release/render-lab
          $lab cook
          $lab packages
          $lab i18n --check
          for investigation in $($lab --list | awk '{print $1}'); do
            $lab --investigation "$investigation" script check
            $lab --investigation "$investigation" graph
          done
      - name: Unit tests
        run: cargo test --release --locked --workspace

  # Windows (x64, MSVC): not supported yet, so this job may fail. Windows has no rpath: it finds a DLL beside
  # the executable, so build.rs copies the standard library's DLL from the toolchain beside the binary, where
  # the lab's (lab.dll) already is. The release does not wait for it.
  windows:
    name: Build, test, check (Windows)
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      # Check out the files as committed: Git for Windows otherwise turns LF into CRLF, and the lab hashes and
      # checks its sources byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Content checks
        run: |
          lab=target/release/render-lab
          $lab cook
          $lab packages
          $lab i18n --check
          for investigation in $($lab --list | awk '{print $1}'); do
            $lab --investigation "$investigation" script check
            $lab --investigation "$investigation" knowledge
            $lab --investigation "$investigation" graph
          done
      # Direct3D 12 on Microsoft's software renderer (WARP): the runner has no GPU. Before `cargo test`, whose build
      # of the lab's dylib can replace the one the binary links. Not yet proven: it reports, but does not block.
      - name: Offscreen renders (Direct3D 12, WARP)
        continue-on-error: true
        env:
          WGPU_BACKEND: dx12
        run: |
          lab=target/release/render-lab
          mkdir -p out
          $lab home --snapshot out/home.png
          $lab home --snapshot out/viewer.png --page viewer
          $lab --investigation o3de/lighting selftest --report out/o3de.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders-windows
          path: out/
      - name: Unit tests
        run: cargo test --release --locked --workspace

  render:
    name: Offscreen renders (software Vulkan)
    runs-on: ubuntu-24.04
    # Not yet proven on lavapipe: it reports, but does not block, until a run shows it is reliable.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install software Vulkan
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - name: Build
        run: cargo build --release --locked
      - name: Render
        run: |
          lab=target/release/render-lab
          mkdir -p out
          $lab home --snapshot out/home.png
          $lab home --snapshot out/viewer.png --page viewer
          $lab home --autotest out/home.json
          $lab --investigation o3de/lighting selftest --report out/o3de.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders
          path: out/

  # A `v*` tag: each platform's package, then one GitHub Release with all of them. A package is the binary, the
  # libraries it links (the lab and the standard library, which it finds beside it: build.rs), the built packages
  # and themes beside it (lab/src/resources.rs, src/theme.rs), and the licenses. The cook hard-links the built
  # packages' files to their sources (or copies them), so they copy as files. No videos: the CI builds none.
  package:
    name: Package (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            os: ubuntu-24.04
            libraries: target/release/liblab.so
            std: libstd-*.so
          - name: x86_64-windows
            os: windows-2025
            # build.rs puts the standard library's DLL beside the binary.
            libraries: target/release/lab.dll target/release/std-*.dll
            std: ""
          - name: aarch64-macos
            os: macos-15
            libraries: target/release/liblab.dylib
            std: libstd-*.dylib
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Windows: the files as committed (Git for Windows otherwise turns LF into CRLF; the lab hashes its sources).
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        # macOS: `-C rpath`, as in the macos job (RUSTFLAGS replaces .cargo/config.toml's flags).
        env:
          RUSTFLAGS: ${{ runner.os == 'macOS' && '-Dwarnings -Crpath' || '-Dwarnings' }}
        run: |
          cargo build --release --locked
          target/release/render-lab cook
      - name: Package
        run: |
          dist="render-lab-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$dist"
          cp target/release/render-lab${{ runner.os == 'Windows' && '.exe' || '' }} ${{ matrix.libraries }} "$dist/"
          if [ -n "${{ matrix.std }}" ]; then cp "$(rustc --print target-libdir)"/${{ matrix.std }} "$dist/"; fi
          cp -rL target/release/packages target/release/themes "$dist/"
          cp -r LICENSE LICENSES THIRD_PARTY.md README.md README.zh-CN.md "$dist/"
          # macOS: every library the binary and the packages' libraries load must be found through @rpath or the
          # system, never at a path on the runner.
          if [ "$RUNNER_OS" = macOS ]; then
            stray=$(find "$dist" -type f \( -name render-lab -o -name '*.dylib' \) | while read -r file; do
              otool -L "$file" | tail -n +2 | awk -v file="$file" '$1 !~ /^(@rpath\/|\/usr\/lib\/|\/System\/)/ {print file " links " $1}'
            done)
            if [ -n "$stray" ]; then echo "$stray"; exit 1; fi
            "$dist/render-lab" --list
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "$dist.zip" "$dist" > /dev/null
            echo "DIST=$dist.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dist.tar.gz" "$dist"
            echo "DIST=$dist.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: ${{ env.DIST }}
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Only the packages: the run's other artifacts (the renders) are the checks' diagnostics.
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Render Lab $GITHUB_REF_NAME" --generate-notes
