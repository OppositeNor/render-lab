# The checks a package's build runs (src/lib.rs): a build-dependency of the
# lab (for its own package, render_lab) and of every package's library.
[package]
name = "render-lab-check"
version = "0.0.6"
edition = "2024"
rust-version = "1.100"
publish = false
description = "Render Lab's build-time checks of a package: its shaders and its text tables"
license = "MIT"

[dependencies]
# The same naga release wgpu 30.0.1 uses, for the WGSL; the manifests.
naga = { version = "=30.0.1", features = ["wgsl-in"] }
# The text tables, Fluent files (lab/src/i18n.rs), and the source index they translate.
fluent-syntax = "=0.12.0"
serde_json = "1"
toml_edit = { version = "=0.25.17", default-features = false, features = ["parse"] }

# The root workspace's lints, here rather than inherited: another workspace
# (a local package's) also builds it, as the lab's build-dependency.
[lints.clippy]
needless_range_loop = "allow"
too_many_lines = "deny"
