# Keep build artifacts inside this project. A fresh clone builds with plain
# `cargo build`, from crates.io. `bash setup.sh` vendors the locked crates
# into `vendor/` and writes `.cache/cargo/config.toml`, which builds from them
# offline whenever CARGO_HOME=$PWD/.cache/cargo (see BUILD.md).
[build]
target-dir = "target"

# macOS: without `-C rpath`, rustc gives a dylib (the lab's, liblab.dylib) its
# build path as its install name, which the binary and the packages' libraries
# record, so a copy elsewhere (a release) cannot find it. With it, the name is
# `@rpath/liblab.dylib`, found through the binary's rpath (build.rs:
# @executable_path). A RUSTFLAGS variable replaces these flags: the CI passes
# `-C rpath` in it on macOS (.github/workflows/ci.yml).
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "rpath"]
